patch:
  # 这里的 rime_ice_suggestion 为雾凇方案的默认预设
  __include: rime_ice_suggestion:/

  key_binder/bindings/+:
   - { when: paging, accept: comma, send: Page_Up }
   - { when: has_menu, accept: period, send: Page_Down }

  # 禁用自动切换到英文模式
  ascii_composer/switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
